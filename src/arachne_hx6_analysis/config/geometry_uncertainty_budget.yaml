# Arachne-HX6 G3 geometry uncertainty budget and arm-mass coupling contract.
#
# status: ANALYSIS_ONLY
# procurement_allowed: false
#
# No CAD tolerance, assembly, deflection, or flapping evidence exists.
# Combination method is left null so the analyzer cannot auto-select
# conservative linear sum or RSS. Arm linear masses are not invented.

status: ANALYSIS_ONLY
procurement_allowed: false

notes: >
  Geometry uncertainty sources and arm-extension mass rates are unknown.
  Nominal CLEARANCE_MET from G2 is not a robust pass. R != 0.30 m remains
  uncoupled until linear, connector, wiring, and reinforcement evidence exist.

