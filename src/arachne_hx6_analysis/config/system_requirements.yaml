# Arachne-HX6 G3 system requirements and planned tests.
#
# status: ANALYSIS_ONLY
# procurement_allowed: false
#
# Hardware thresholds stay null. Do not invent "reasonable" values.
# Quantitative nulls produce INCOMPLETE_REQUIREMENT.

status: ANALYSIS_ONLY
procurement_allowed: false

notes: >
  Formal requirements, evidence links, and planned tests for Arachne-HX6.
  Hardware numeric limits are unknown. This file is an engineering contract,
  not a flyable, procurement, or hardware-validation conclusion. Completing
  G3 does not unlock procurement, physical assembly, or the next stage.

tests:
  - test_id: TEST-MASS-001
    title: Weigh the 19 G2 mass-ledger items
    method: component weigh with recorded equipment and sample count
    linked_requirement_ids: [SYS-MASS-001, SYS-MASS-002]
    status: NOT_PERFORMED
    notes: No hardware has been purchased or weighed.
  - test_id: TEST-MASS-002
    title: Measure vehicle center of gravity
    method: CG measurement of a complete article
    linked_requirement_ids: [SYS-MASS-003]
    status: NOT_PERFORMED
    notes: No complete article exists.
  - test_id: TEST-GEO-001
    title: Measure geometry uncertainty sources
    method: tolerance stack from CAD, assembly, and deflection evidence
    linked_requirement_ids: [SYS-GEO-001, SYS-GEO-003]
    status: NOT_PERFORMED
    notes: No CAD tolerance or assembly evidence.
  - test_id: TEST-STOW-001
    title: Measure stowed envelope
    method: hardware envelope measurement of a qualified stow pose
    linked_requirement_ids: [SYS-STOW-001]
    status: NOT_PERFORMED
    notes: analysis_stowed is not a hardware pose.
  - test_id: TEST-STOW-002
    title: Lock load and stiffness test
    method: static lock-load and stiffness test
    linked_requirement_ids: [SYS-STOW-005]
    status: NOT_PERFORMED
    notes: No lock hardware.
  - test_id: TEST-PROP-001
    title: Propulsion bench
    method: motor-ESC-propeller thrust and power bench
    linked_requirement_ids: [SYS-PROP-004]
    status: NOT_PERFORMED
    notes: No bench, motor, ESC, or propeller.
  - test_id: TEST-STRUCT-001
    title: Arm-extension mass interval
    method: weigh extension, connector, wiring, and reinforcement
    linked_requirement_ids: [SYS-STRUCT-002]
    status: NOT_PERFORMED
    notes: Do not invent kilograms per metre.
  - test_id: TEST-SAFE-001
    title: Design inspection for non-weaponization
    method: design inspection of repository and payload interfaces
    linked_requirement_ids: [SYS-SAFE-001, SYS-SAFE-002]
    status: NOT_PERFORMED
    notes: Planned inspection record. Not a hardware test.
  - test_id: TEST-TRACE-001
    title: Traceability audit
    method: audit requirement-evidence-test-report links
    linked_requirement_ids: [SYS-TRACE-001, SYS-MASS-004]
    status: NOT_PERFORMED
    notes: Coverage is diagnostic only.

requirements:
  - requirement_id: SYS-MASS-001
    title: Itemized non-battery mass ledger completeness
    category: SYS-MASS
    description: The G2 19-item non-battery mass ledger must be complete before a whole-vehicle mass interval is claimed.
    rationale: Missing part masses cannot be treated as zero.
    verification_method: TEST
    required_evidence_ids: [EV-MASS-001, EV-MASS-002, EV-MASS-003, EV-MASS-004, EV-MASS-005, EV-MASS-006, EV-MASS-007, EV-MASS-008, EV-MASS-009, EV-MASS-010, EV-MASS-011, EV-MASS-012, EV-MASS-013, EV-MASS-014, EV-MASS-015, EV-MASS-016, EV-MASS-017, EV-MASS-018, EV-MASS-019]
    linked_test_ids: [TEST-MASS-001]
    linked_report_fields: [mass_ledger_status, missing_component_ids]
    threshold: null
    value: null
    range_lower: null
    range_upper: null
    unit: null
    applicability: all_configurations
    blocking: true
    notes: Reuses the G2 19-item list. No new conflicting parts list.
    kind: qualitative
  - requirement_id: SYS-MASS-002
    title: Whole-vehicle mass interval
    category: SYS-MASS
    description: When every required component has a finite lower and upper mass, total_lower = sum(quantity * lower) and total_upper = sum(quantity * upper).
    rationale: Interval propagation must not collapse to a midpoint or treat null as 0.
    verification_method: ANALYSIS_AND_TEST
    required_evidence_ids: [EV-MASS-001, EV-MASS-002, EV-MASS-003, EV-MASS-004, EV-MASS-005, EV-MASS-006, EV-MASS-007, EV-MASS-008, EV-MASS-009, EV-MASS-010, EV-MASS-011, EV-MASS-012, EV-MASS-013, EV-MASS-014, EV-MASS-015, EV-MASS-016, EV-MASS-017, EV-MASS-018, EV-MASS-019]
    linked_test_ids: [TEST-MASS-001]
    linked_report_fields: [total_mass_lower_kg, total_mass_upper_kg, component_mass_interval_status]
    threshold: null
    value: null
    range_lower: null
    range_upper: null
    unit: kg
    applicability: all_configurations
    blocking: true
    notes: No real vehicle mass interval exists.
    kind: quantitative
